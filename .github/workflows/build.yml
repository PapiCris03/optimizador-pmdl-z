name: Build Optimizador PMDL Z

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Create Android icon
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets

          cat > background.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
            <rect width="1024" height="1024" fill="#07060a"/>
          </svg>
          EOF

          cat > foreground.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
          <circle cx="512" cy="512" r="230" fill="none" stroke="#ff7a18" stroke-width="24"/>
          <text x="512" y="610" font-family="serif" font-size="300" font-weight="bold" fill="#ffc93c" text-anchor="middle">悟</text>
          </svg>
          EOF

          cat > full.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
            <rect width="1024" height="1024" rx="180" fill="#07060a"/>
            <circle cx="512" cy="512" r="400" fill="none" stroke="#ff7a18" stroke-width="36"/>
            <circle cx="512" cy="512" r="340" fill="#12100f"/>
            <text x="512" y="660" font-family="serif" font-size="520" font-weight="bold" fill="#ffc93c" text-anchor="middle">悟</text>
          </svg>
          EOF

          convert -background none background.svg -resize 1024x1024 assets/icon-background.png
          convert -background none foreground.svg -resize 1024x1024 assets/icon-foreground.png
          convert -background none full.svg -resize 1024x1024 assets/icon-only.png
          convert -background "#07060a" full.svg -resize 2732x2732 assets/splash.png
          convert -background "#07060a" full.svg -resize 2732x2732 assets/splash-dark.png

          npm install @capacitor/assets --save-dev --no-audit --no-fund
          npx capacitor-assets generate --android

      - name: Verify Android icons
        shell: bash
        run: |
          find android/app/src/main/res -name "ic_launcher*" | sort

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Optimizador-PMDL-Z-APK
          path: android/app/build/outputs/apk/debug/*.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Install icon generator
        run: npm install sharp --no-save

      - name: Create Saiyan icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null

          @'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
            <rect width="1024" height="1024" rx="180" fill="#07060a"/>
            <circle cx="512" cy="512" r="400" fill="none" stroke="#ff7a18" stroke-width="36"/>
            <circle cx="512" cy="512" r="340" fill="#12100f"/>
            <text x="512" y="660" font-family="serif" font-size="520" font-weight="bold" fill="#ffc93c" text-anchor="middle">悟</text>
          </svg>
          '@ | Set-Content -Path icon.svg -Encoding UTF8

          node -e "const sharp=require('sharp');sharp('icon.svg').resize(1024,1024).png().toFile('icon.png').then(()=>console.log('PNG creado'))"

          npx tauri icon icon.png

          if (!(Test-Path 'src-tauri/icons/icon.ico')) {
            Write-Error 'No se generó src-tauri/icons/icon.ico'
            exit 1
          }

      - name: Verify icon
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/icons
          if (!(Test-Path 'src-tauri/icons/icon.ico')) {
            Write-Error 'Falta icon.ico'
            exit 1
          }

      - name: Build Tauri app
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Optimizador-PMDL-Z-Windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
