name: Build Optimizador PMDL Z

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Optimizador-PMDL-Z-APK
          path: android/app/build/outputs/apk/debug/*.apk

    build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

            - name: Create Saiyan icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          @'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
            <rect width="1024" height="1024" rx="180" fill="#07060a"/>
            <circle cx="512" cy="512" r="400" fill="none" stroke="#ff7a18" stroke-width="36"/>
            <circle cx="512" cy="512" r="340" fill="#12100f"/>
            <text x="512" y="660" font-family="serif" font-size="520" font-weight="bold" fill="#ffc93c" text-anchor="middle">悟</text>
          </svg>
          '@ | Set-Content -Path icon.svg -Encoding UTF8
          magick icon.svg -resize 1024x1024 icon.png
          magick icon.png -define icon:auto-resize=256,128,64,48,32,16 src-tauri/icons/icon.ico
          Copy-Item icon.png src-tauri/icons/icon.png
          
      - name: Build Tauri app
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Optimizador-PMDL-Z-Windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
